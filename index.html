<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff5f7" />
  <title>کیک ریلیا | Riliacake</title>
  <meta name="description" content="کیک ریلیا — سفارش کیک‌های خانگی و تازه با یک تماس. اینستاگرام و کانال ایتا." />

  <!-- فونت وزیرمتن با اتصال سریع و بهینه -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-1: #fff5f7;
      --bg-2: #ffe4ec;
      --card: #ffffff;
      --text: #2b1d24;
      --muted: #7a6570;
      --primary: #e91e63;
      --primary-dark: #c2185b;
      --shadow: 0 20px 60px rgba(233, 30, 99, 0.15);
      --radius: 24px;
    }

    /* ریست استاندارد Box-Sizing */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 50% -10%, var(--bg-2), var(--bg-1) 60%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 24px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: linear-gradient(90deg, var(--primary), #ff8fab, var(--primary));
    }

    .logo-img {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      box-shadow: 0 8px 24px rgba(233, 30, 99, 0.2);
      border: 3px solid #ffffff;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 14.5px;
      color: var(--muted);
      margin-bottom: 24px;
      font-weight: 400;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:focus-visible {
      outline: 3px solid rgba(233, 30, 99, 0.4);
      outline-offset: 2px;
    }

    .btn-call {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.3);
    }

    .btn-insta {
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      box-shadow: 0 8px 20px rgba(220, 39, 67, 0.28);
    }

    .btn-eitaa {
      background: linear-gradient(135deg, #2aabee, #229ed9);
      box-shadow: 0 8px 20px rgba(42, 171, 238, 0.28);
    }

    .btn .icon {
      font-size: 20px;
      line-height: 1;
    }

    .phone {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
      direction: ltr;
      letter-spacing: 0.5px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #f0e3e8;
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 14px;
      border-radius: 999px;
      background: #fff0f4;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 700;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #a8939c;
    }

    @media (max-width: 400px) {
      .card {
        padding: 28px 18px 22px;
      }

      h1 {
        font-size: 22px;
      }

      .btn {
        font-size: 15px;
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>
  <main class="card" role="main">
    <img src="photo_30669583598_x.jpg" alt="لوگوی کیک ریلیا" class="logo-img" />
    <h1>کیک ریلیا</h1>
    <p class="subtitle">Riliacake — سفارش کیک‌های تازه، با یک تماس</p>

    <div class="actions">
      <a class="btn btn-call" href="tel:+989361331800" aria-label="تماس فوری تلفنی">
        <span class="icon" aria-hidden="true">📞</span>
        <span>
          تماس فوری
          <span class="phone">0936 133 1800</span>
        </span>
      </a>

      <a class="btn btn-insta" href="https://instagram.com/riliacake" target="_blank" rel="noopener noreferrer"
        aria-label="صفحه اینستاگرام ریلیا">
        <span class="icon" aria-hidden="true">📷</span>
        <span>صفحه اینستاگرام</span>
      </a>

      <a class="btn btn-eitaa" href="https://eitaa.com/Riliacake" target="_blank" rel="noopener noreferrer"
        aria-label="کانال ایتا ریلیا">
        <span class="icon" aria-hidden="true">💬</span>
        <span>کانال / چت ایتا</span>
      </a>
    </div>

    <div class="divider">پیگیری سفارش‌ها</div>
    <p class="note">برای مشاهده نمونه‌کارها و ثبت سفارش، از طریق اینستاگرام یا ایتا با ما در ارتباط باشید.</p>
    <span class="badge">پاسخ‌گویی سریع</span>

    <footer>© کیک ریلیا — Riliacake</footer>
  </main>
</body>

</html>
